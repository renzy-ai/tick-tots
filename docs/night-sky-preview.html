<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>夜间星空预览 · 嘀嗒童行</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
    font-family: system-ui, sans-serif;
  }
  .night-sky { position: absolute; inset: 0; overflow: hidden; }
  .nebula { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.5; }
  .nebula-a {
    width: 46vmax; height: 46vmax; left: -12vmax; top: -10vmax;
    background: radial-gradient(circle, rgba(86,104,178,0.35) 0%, transparent 65%);
  }
  .nebula-b {
    width: 40vmax; height: 40vmax; right: -10vmax; bottom: -12vmax;
    background: radial-gradient(circle, rgba(120,92,168,0.3) 0%, transparent 65%);
  }
  .moon-halo {
    position: absolute; width: 220px; height: 220px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(214,230,255,0.2) 0%, rgba(180,205,245,0.09) 38%, transparent 72%);
    filter: blur(5px);
  }
  .shooting-star { position: absolute; opacity: 0; will-change: transform, opacity; }
  .shooting-star .tail {
    display: block; width: 140px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 100%);
    transform: rotate(24deg); transform-origin: right center;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.85));
  }
  .s1 { top: 6%; left: 22%; animation: shoot 16s ease-in 0s infinite; }
  .s2 { top: 4%; left: 58%; animation: shoot 21s ease-in 7s infinite; }
  .s3 { top: 10%; left: 72%; animation: shoot 26s ease-in 14s infinite; }
  @keyframes shoot {
    0% { opacity: 0; transform: translate(0,0); }
    3% { opacity: 1; }
    7% { opacity: 1; transform: translate(240px, 120px); }
    9% { opacity: 0; transform: translate(260px, 130px); }
    100% { opacity: 0; transform: translate(260px, 130px); }
  }
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 4px rgba(255,255,255,0.8); transform: translate(-50%, -50%);
    animation: twinkle ease-in-out infinite; will-change: opacity, transform;
  }
  .star.bright { box-shadow: 0 0 6px rgba(255,255,255,0.95), 0 0 12px rgba(190,215,255,0.6); }
  @keyframes twinkle {
    0%,100% { opacity: 0.25; transform: translate(-50%,-50%) scale(0.85); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  }
  /* 中央月亮占位（对应 now-section 的 🌙 活动图标） */
  .moon {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    font-size: 120px; line-height: 1; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.22));
  }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    color: rgba(232,238,252,0.55); font-size: 13px; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="night-sky">
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="moon-halo" style="left: 50%; top: 40%"></div>
    <div class="shooting-star s1"><span class="tail"></span></div>
    <div class="shooting-star s2"><span class="tail"></span></div>
    <div class="shooting-star s3"><span class="tail"></span></div>
    <div class="moon">🌙</div>
    <div class="stars" id="stars"></div>
  </div>
  <div class="hint">夜间星空预览 · 星星集中在月亮左右两侧空白区（与 App 内 NightSky 组件一致）</div>

<script>
  // 与 NightSky.svelte 完全一致的固定种子 PRNG（mulberry32）
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const MOON_X = 50;
  const rnd = mulberry32(20260822);
  const stars = [];
  const perSide = 64;
  const ranges = [[2, MOON_X - 8], [MOON_X + 8, 98]];
  for (const [x0, x1] of ranges) {
    for (let i = 0; i < perSide; i++) {
      const x = x0 + rnd() * (x1 - x0);
      const y = 4 + rnd() * 90;
      const r = rnd();
      const bright = r > 0.88;
      const size = bright ? 3 + rnd() * 2.4 : 1 + rnd() * 1.8;
      stars.push({ x, y, size, bright, delay: rnd() * 4, dur: 2.4 + rnd() * 3.2 });
    }
  }
  const host = document.getElementById('stars');
  for (const s of stars) {
    const el = document.createElement('span');
    el.className = 'star' + (s.bright ? ' bright' : '');
    el.style.left = s.x + '%';
    el.style.top = s.y + '%';
    el.style.width = s.size + 'px';
    el.style.height = s.size + 'px';
    el.style.animationDelay = s.delay + 's';
    el.style.animationDuration = s.dur + 's';
    host.appendChild(el);
  }
</script>
</body>
</html>
